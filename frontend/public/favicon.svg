<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="magnetGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="#0f172a" />
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#1e293b" stroke-width="2" />

  <!-- Magnetic energy aura / waves -->
  <path d="M42 36C52 26 76 26 86 36" stroke="url(#sparkGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8" />
  <path d="M48 24C58 14 70 14 80 24" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Horseshoe Magnet Body -->
  <path
    d="M32 40V72C32 89.673 46.327 104 64 104C81.673 104 96 89.673 96 72V40H76V72C76 78.627 70.627 84 64 84C57.373 84 52 78.627 52 72V40H32Z"
    fill="url(#magnetGrad)"
    filter="url(#glow)"
  />

  <!-- Magnet Pole Caps (Red/Silver accent styling) -->
  <!-- Left North Pole (Cyan accent) -->
  <path d="M32 40H52V52H32V40Z" fill="#38bdf8" rx="2" />
  <!-- Right South Pole (Indigo accent) -->
  <path d="M76 40H96V52H76V40Z" fill="#a855f7" rx="2" />

  <!-- Energy Spark Center -->
  <circle cx="64" cy="54" r="5" fill="#38bdf8" filter="url(#glow)" />
  <path d="M64 45V63M55 54H73" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
</svg>
