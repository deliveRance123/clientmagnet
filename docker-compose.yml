version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: client_magnet_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: client_magnet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d client_magnet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
